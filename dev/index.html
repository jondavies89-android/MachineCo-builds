<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>MachineCo</title>
    <link rel="icon" href="data:,">
    <style>
      /* The canvas always fills the browser window; the game camera fits the board inside it. */
      /* The background matches the camera's, so the spare space beside the board reads as letterboxing. */
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #0d0f1c;
      }
      #unity-canvas {
        position: fixed;
        left: 0;
        top: 0;
        display: block;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        outline: none;
        touch-action: none;
        background: #0d0f1c;
      }
      #loading {
        position: fixed;
        left: 15%;
        right: 15%;
        top: 50%;
        height: 6px;
        background: #262b40;
      }
      #loading-fill {
        width: 0;
        height: 100%;
        background: #4fd8ff;
      }
      #load-error {
        position: fixed;
        left: 16px;
        right: 16px;
        top: 16px;
        color: #ffb4b4;
        font: 16px sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div id="loading-fill"></div></div>
    <div id="load-error"></div>
    <script src="Build/dev.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/dev.data.unityweb",
        frameworkUrl: "Build/dev.framework.js.unityweb",
        codeUrl: "Build/dev.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MachineCo",
        productName: "MachineCo",
        productVersion: "1.0+dev.7e6497b",
        // Sharp on high-DPI screens, capped so a 3x phone doesn't render nine times the pixels.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (progress) {
        document.querySelector("#loading-fill").style.width = 100 * progress + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
      }).catch(function (message) {
        document.querySelector("#load-error").textContent = message;
      });
    </script>
  </body>
</html>
